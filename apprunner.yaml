# AWS App Runner — source-based deploy (Python managed runtime).
#
# Connect this repo in the App Runner console (Source: GitHub, config file:
# apprunner.yaml, auto-deploy ON) and every push to main redeploys — the same
# DX as Amplify. The AI backend is Bedrock via the service's INSTANCE ROLE
# (bedrock:InvokeModel) — no API keys anywhere. Model list / best practices:
# api/aws_models.py.
#
# The React UI is prebuilt and committed under api/static/ (this runtime has
# no Node); rebuild locally with `cd ui && npm install && npm run build`.
version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    # Bedrock-first: default provider/model comes from api/aws_models.py and
    # rides the instance role via the AWS default credential chain.
    - name: PROCESSIQ_BEDROCK
      value: "1"
    # Workspace data (DuckDB + specs). /tmp is always writable on App Runner.
    # NOTE v1: this disk is EPHEMERAL — a redeploy resets workspaces.
    - name: PROCESSIQ_DATA
      value: /tmp/processiq-data
